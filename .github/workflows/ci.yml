name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetingly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "test-secret-key-not-for-production"
      HF_TOKEN: "hf_dummy_token_for_ci_testing"
      GROQ_API_KEY: "gsk_dummy_groq_key_for_ci_testing"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/meetingly_test"
      REDIS_URL: "redis://localhost:6379/0"
      DB_NAME: meetingly_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      GOOGLE_CLIENT_ID: "dummy-google-client-id-for-ci"
      GOOGLE_CLIENT_SECRET: "dummy-google-secret-for-ci"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Setup Google OAuth SocialApp
        run: python manage.py setup_google_oauth

      - name: Run tests
        run: pytest --tb=short -v

      - name: Lint with ruff
        run: ruff check .
